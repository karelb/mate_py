{% extends "base.html" %}
{% block content %}
<div class="container mate-home">
  <div class="jumbotron">
    <h1>{{ home_title }}</h1>
    <div class="lead">{{ home_html|safe }}</div>
  </div>
  <div class="row">
    {% for entry in menu %}
    <div class="col-sm-6 col-md-4">
      {% if entry.children is defined %}
      <div class="panel panel-default">
        <div class="panel-heading"><h3 class="panel-title">{{ entry.title }}</h3></div>
        <div class="list-group">
          {% for item in entry.children %}<a class="list-group-item" href="{{ item.url }}">{{ item.title }}</a>{% endfor %}
        </div>
      </div>
      {% else %}
      <div class="list-group"><a class="list-group-item" href="{{ entry.url }}">{{ entry.title }}</a></div>
      {% endif %}
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
